<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }
        
        .grid-item {
            color: white;
            padding: 60px;
            text-align: center;
            border-radius: 8px;
            border-style: solid;
            font-weight: bold;
            font-size: 18px;
        }
        
        .grid-item:nth-child(1) { background-color: #FF6B6B; grid-column: span 2; grid-row: span 2; }
        .grid-item:nth-child(2) { background-color: #4ECDC4; grid-column: span 2; }
        .grid-item:nth-child(3) { background-color: #45B7D1; }
        .grid-item:nth-child(4) { background-color: #FFA07A; }
        .grid-item:nth-child(5) { background-color: #98D8C8; grid-column: span 2; }
        .grid-item:nth-child(6) { background-color: #F7DC6F; grid-row: span 2; }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-item">Item 1</div>
        <div class="grid-item">Item 2</div>
        <div class="grid-item">Item 3</div>
        <div class="grid-item">Item 4</div>
        <div class="grid-item">Item 5</div>
        <div class="grid-item">Item 6</div>
    </div>
</body>
</html>
