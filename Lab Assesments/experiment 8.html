<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f4f4f6 0%, #f9f8fa 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 900px;
            width: 100%;
        }

        .profile-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
            display: flex;
            flex-direction: row;
            gap: 30px;
            align-items: center;
            justify-content: flex-start;
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #667eea;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 50px;
            flex-shrink: 0;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }
        .profile-details {
            display: flex;
            flex-direction: row;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .detail-item label {
            color: #999;
            font-size: 12px;
            font-weight: 600;
        }

        .detail-item span {
            color: #333;
            font-weight: 500;
        }
        @media (max-width: 768px) {
            .profile-card {
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
            }

            .profile-image {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-card">
            <div class="profile-image">K</div>
            <div class="profile-info">
                <h2>Kartikey</h2>
                <div class="profile-details">
                    <div class="detail-item">
                        <span>Btech CSE</span>
                    </div>
                    <div class="detail-item">
                        <span>Roll No 123456</span>
                    </div>
                    <div class="detail-item">
                        <span>1st Year</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="profile-card">
            <div class="profile-image">K</div>
            <div class="profile-info">
                <h2>Kanav</h2>
                <div class="profile-details">
                    <div class="detail-item">
                        <span>Btech IT</span>
                    </div>
                    <div class="detail-item">
                        <span>Roll No 987456</span>
                    </div>
                    <div class="detail-item">
                        <span>2nd Year</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
