<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #fcfcfb;
            padding: 20px;
        }
        header {
            background-color: #333;
            color: rgb(254, 255, 254);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        section {
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        nav a {
            display: inline-block;
            padding: 10px 20px;
            margin: 5px;
            background-color: #555;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        nav a:hover {
            background-color: #777;
        }
        code {
            padding: 2px 6px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Navigation Menu</h1>
    </header>
    <section>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>
    </section>
</body>
</html>
