<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        .product-grid {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(4, 1fr);
        }
        .product-card {
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-image {
            width: 100%;
            height: 200px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
        }
        .product-info {
            padding: 15px;
        }
        .product-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        .product-price {
            font-size: 18px;
            color: #27ae60;
            font-weight: bold;
        }
        /* Tablet Breakpoint (600px - 1024px) */
        @media (max-width: 1024px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        /* Mobile Breakpoint (≤600px) */
        @media (max-width: 600px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
            body {
                padding: 10px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Our Products</h1>
        <div class="product-grid">
            <div class="product-card">
                <div class="product-image">Product 1</div>
                <div class="product-info">
                    <div class="product-name">Product One</div>
                    <div class="product-price">Rs.999</div>
                </div>
            </div>
            <div class="product-card">
                <div class="product-image">Product 2</div>
                <div class="product-info">
                    <div class="product-name">Product Two</div>
                    <div class="product-price">Rs.399</div>
                </div>
            </div>
            <div class="product-card">
                <div class="product-image">Product 3</div>
                <div class="product-info">
                    <div class="product-name">Product Three</div>
                    <div class="product-price">Rs.499</div>
                </div>
            </div>
            <div class="product-card">
                <div class="product-image">Product 4</div>
                <div class="product-info">
                    <div class="product-name">Product Four</div>
                    <div class="product-price">Rs.5999</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
